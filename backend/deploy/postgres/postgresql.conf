# BoomMall Boom Coin — on-premise PostgreSQL
# Loaded via: postgres -c config_file=/etc/postgresql/postgresql.conf

listen_addresses = '*'
port = 5432
max_connections = 100

# Memory — tune per company server (defaults safe for ~4–8 GB RAM box)
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# WAL / durability
wal_level = replica
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# Locale / logging
log_timezone = 'Asia/Bangkok'
timezone = 'Asia/Bangkok'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_line_prefix = '%t [%p] %u@%d '

# --- TLS between Backend API and PostgreSQL ---
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_ca_file = '/var/lib/postgresql/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'

password_encryption = scram-sha-256
