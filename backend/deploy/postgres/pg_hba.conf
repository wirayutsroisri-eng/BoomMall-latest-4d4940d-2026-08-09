# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket (backup / maintenance inside container)
local   all             all                                     scram-sha-256

# Docker internal network — require TLS
# Compose network default subnet is typically 172.x.0.0/16; we allow all Docker
# bridges but force hostssl so plaintext TCP is rejected.
hostssl all             all             10.0.0.0/8              scram-sha-256
hostssl all             all             172.16.0.0/12           scram-sha-256
hostssl all             all             192.168.0.0/16          scram-sha-256
hostssl all             all             fc00::/7                scram-sha-256

# Reject non-SSL remote connections
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
