<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Boom Mall Shipping Label 4×6</title>
  <link rel="stylesheet" href="./shipping-label-4x6.css" />
</head>
<body>
  <!-- แม่แบบอ้างอิง — engine จริงเติมข้อมูลใน labelTemplate.ts -->
  <section class="sheet">
    <header class="header">
      <div style="display:flex;align-items:center;gap:2mm">
        <div class="mark">B</div>
        <div class="wordmark">Boom Mall<small>Shipping Label · 4×6</small></div>
      </div>
      <strong>KERRY</strong>
    </header>
    <div class="track-no">BM260815A1B2C3</div>
    <img class="barcode" alt="barcode" src="" />
    <div class="badge paid">ชำระเงินแล้ว (PAID)</div>
    <div class="parties">
      <div class="box">
        <div class="who">ร้านค้าผู้ส่ง</div>
      </div>
      <div class="box to">
        <div class="who">ชื่อผู้รับ · เบอร์โทร · ที่อยู่</div>
      </div>
    </div>
    <table class="slip">
      <thead>
        <tr>
          <th class="chk">[ ]</th>
          <th class="ico"></th>
          <th>จัดของ · สินค้า</th>
          <th>ตัวเลือก</th>
          <th class="qty">ชิ้น</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="chk"><span class="box-tick"></span></td>
          <td class="ico"><span class="mark-box">H</span></td>
          <td>Hub Motor ล้อ 14"</td>
          <td>3000W</td>
          <td class="qty">x1</td>
        </tr>
      </tbody>
    </table>
    <div class="totals"><span>รวม 3 รายการ (5 ชิ้น)</span><span>ยอดสุทธิ ฿0</span></div>
    <footer class="foot">Thank you for shopping on Boom Mall</footer>
  </section>
</body>
</html>
